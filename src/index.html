<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShowroomAuto</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- applique le thème choisi avant l'affichage pour éviter un flash de la mauvaise couleur -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@200;300;400;600&display=swap" rel="stylesheet">
</head>

</body>
</html>
